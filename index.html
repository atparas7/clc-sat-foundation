<style>
  :root{
    --ink:#141a2b;
    --paper:#ffffff;
    --surface:#f7f8fa;
    --muted:#5b6472;
    --line:#e2e5eb;
    --accent:#a9781f;
    --accent-soft:#f6ecd8;
    --english:#7b3f61;
    --english-soft:#f4e9ee;
    --practice:#1f6f78;
    --practice-soft:#e7f2f1;
    --full:#3a4f8a;
    --full-soft:#eaeef8;
    --shadow: 0 1px 2px rgba(20,26,43,.06), 0 8px 24px rgba(20,26,43,.06);
  }
  @media (prefers-color-scheme: dark){
    :root[data-theme="dark"]{
      --ink:#e7ebf3; --paper:#0d121e; --surface:#161e30; --muted:#9aa5b8; --line:#2a3550;
      --accent:#e4bb6c; --accent-soft:#2c2413;
      --english:#e19bbb; --english-soft:#2a1f28;
      --practice:#6fd0d8; --practice-soft:#122a2b;
      --full:#8fa3e0; --full-soft:#1c2340;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --ink:#e7ebf3; --paper:#0d121e; --surface:#161e30; --muted:#9aa5b8; --line:#2a3550;
    --accent:#e4bb6c; --accent-soft:#2c2413;
    --english:#e19bbb; --english-soft:#2a1f28;
    --practice:#6fd0d8; --practice-soft:#122a2b;
    --full:#8fa3e0; --full-soft:#1c2340;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Fraunces',Georgia,'Times New Roman',serif; text-wrap:balance;}
  .mono{font-family:'IBM Plex Mono','Courier New',monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  #app{max-width:720px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; padding:0 16px;}
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--paper); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; padding:14px 0; margin:0 -16px; padding-left:16px; padding-right:16px;
  }
  .backbtn{
    border:none; background:var(--surface); color:var(--ink); width:36px; height:36px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow); flex-shrink:0;
    font-size:16px;
  }
  .backbtn:focus-visible, button:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .topbar h1{font-size:18px; margin:0; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .topbar-logo{width:26px; height:26px; object-fit:contain; flex-shrink:0;}
  main{flex:1; padding:20px 0 48px;}
  .eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0 0 6px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:var(--shadow); margin-bottom:14px;}
  .tile{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--surface);
    border:1px solid var(--line); border-radius:16px; padding:18px; cursor:pointer; box-shadow:var(--shadow);
    margin-bottom:12px; transition:transform .12s ease;
  }
  .tile:hover{transform:translateY(-1px);}
  .tile .icon{width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:21px; flex-shrink:0;}
  .tile .body{flex:1; min-width:0;}
  .tile .body strong{display:block; font-size:17px; margin-bottom:2px;}
  .tile .body span{display:block; font-size:13px; color:var(--muted); line-height:1.4;}
  .tile .chev{color:var(--muted); font-size:18px; flex-shrink:0;}
  .section-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  @media (max-width:480px){.section-grid{grid-template-columns:1fr 1fr 1fr; gap:8px;}}
  .section-grid.grid-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:720px){.section-grid.grid-4{grid-template-columns:1fr 1fr;}}
  .tile-col{
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px 10px;
    cursor:pointer; box-shadow:var(--shadow); transition:transform .12s ease;
  }
  .tile-col:hover{transform:translateY(-2px);}
  .tile-col .icon{width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:4px;}
  .tile-col strong{font-size:14.5px;}
  .tile-col span{font-size:11.5px; color:var(--muted); line-height:1.3;}
  @media (max-width:380px){
    .tile-col{padding:14px 6px;}
    .tile-col strong{font-size:13px;}
    .tile-col span{font-size:10.5px;}
  }
  .btn{border:none; border-radius:12px; padding:13px 20px; font-size:15px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;}
  .btn.primary{background:var(--ink); color:var(--paper);}
  .btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line);}
  .btn.gold{background:var(--accent); color:#fff;}
  .field{width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:15px; margin-bottom:12px;}
  .subject-strip{height:4px; border-radius:4px 4px 0 0; margin:-20px -20px 16px;}
  .empty{text-align:center; color:var(--muted); padding:36px 16px; font-size:14px; line-height:1.6;}
  .empty .big{font-size:32px; margin-bottom:10px;}
  footer.foot{text-align:center; color:var(--muted); font-size:12.5px; padding:20px 0 8px;}
  .badge{display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.02em;}
  .badge.easy{background:#e5f3ec; color:#2f7d5a;}
  .badge.medium{background:var(--accent-soft); color:var(--accent);}
  .badge.hard{background:#fbe9e7; color:#b4433a;}
  :root[data-theme="dark"] .badge.easy{background:#102a1f; color:#69cd9c;}
  :root[data-theme="dark"] .badge.hard{background:#2c1714; color:#e88478;}
  .progress-dots{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .progress-dots span{width:20px; height:6px; border-radius:4px; background:var(--line);}
  .progress-dots span.done{background:var(--ink);}
  .progress-dots span.current{background:var(--accent);}
  .passage{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; font-size:15px; line-height:1.65;}
  .qstem{font-size:16px; line-height:1.55; margin:0 0 16px; font-weight:600;}
  .choice{
    display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; background:var(--surface);
    border:1.5px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; cursor:pointer; font-size:15px; line-height:1.4;
  }
  .choice .letter{width:26px; height:26px; border-radius:8px; background:var(--paper); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; font-family:'IBM Plex Mono',monospace;}
  .choice.correct{border-color:#2f7d5a; background:#e5f3ec;}
  .choice.correct .letter{background:#2f7d5a; color:#fff;}
  .choice.incorrect{border-color:#b4433a; background:#fbe9e7;}
  .choice.incorrect .letter{background:#b4433a; color:#fff;}
  :root[data-theme="dark"] .choice.correct{border-color:#69cd9c; background:#102a1f;}
  :root[data-theme="dark"] .choice.correct .letter{background:#69cd9c; color:#0d121e;}
  :root[data-theme="dark"] .choice.incorrect{border-color:#e88478; background:#2c1714;}
  :root[data-theme="dark"] .choice.incorrect .letter{background:#e88478; color:#2c1714;}
  .explain-panel{border:1px solid var(--line); border-radius:14px; padding:16px; margin:6px 0 16px; background:var(--surface);}
  .explain-panel .row2{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .explain-panel .verdict{font-weight:700; font-size:14px;}
  .explain-panel .verdict.ok{color:#2f7d5a;}
  .explain-panel .verdict.no{color:#b4433a;}
  .explain-block{margin-bottom:10px; font-size:13.5px; line-height:1.55;}
  .explain-block b{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:2px; font-weight:700;}
  .poe-item{font-size:13px; line-height:1.5; margin-bottom:6px; padding-left:4px;}
  .score-hero{text-align:center; padding:28px 20px; border-radius:18px; background:var(--accent-soft); border:1px solid var(--line); margin-bottom:16px;}
  .score-hero .num{font-family:'Fraunces',serif; font-size:44px; font-weight:700; line-height:1; color:var(--accent);}
  .score-hero .lbl{color:var(--muted); font-size:13px; margin-top:6px;}
  .slideshow{border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#111; margin-bottom:12px;}
  .slideshow img{display:block; width:100%; height:auto;}
  .slideshow-bar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px;}
  .slideshow-bar .navbtn{
    border:none; background:var(--surface); color:var(--ink); width:40px; height:40px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow); font-size:18px; flex-shrink:0;
  }
  .slideshow-bar .navbtn:disabled{opacity:.35; cursor:not-allowed;}
  .slideshow-bar .count{font-size:13px; color:var(--muted); font-family:'IBM Plex Mono',monospace;}

  .signin-card{
    max-width:400px; margin:48px auto; background:#faf6ec; border:1px solid #e7ddc7;
    border-radius:4px; padding:40px 36px 36px; text-align:center; box-shadow:var(--shadow);
  }
  .signin-logo{width:88px; height:auto; margin:0 auto 14px; display:block;}
  .signin-brand{font-family:'Fraunces',Georgia,serif; font-size:20px; font-weight:400; color:#2b2f3a; margin:0 0 14px;}
  .signin-brand b{font-weight:700;}
  .signin-divider{width:46px; height:2px; background:#a8822f; margin:0 auto 22px;}
  .signin-title{font-size:24px; margin:0 0 10px; color:#1c2340;}
  .signin-sub{color:#6b6f78; font-size:14px; line-height:1.55; max-width:300px; margin:0 auto 24px;}
  .signin-row2{display:flex; gap:10px;}
  .signin-row2 .field{flex:1;}
  .signin-card .field{background:#fff; border:1px solid #d9d2bd; color:#1c2340;}
  .signin-btn{width:100%; background:#7a1f2b; color:#fff; margin-top:6px; padding:14px; font-weight:600; letter-spacing:.01em; border-radius:4px;}
  .signin-btn:hover{background:#661a24;}
  .signin-error{color:#b4433a; font-size:13px; margin:-4px 0 12px; text-align:left;}
  body.signin-page{background:#f5f1e6;}
  body.signin-page #app{padding:0 16px;}
  body.signin-page main{padding:0;}
  @media (prefers-color-scheme: dark){
    :root[data-theme="dark"] body.signin-page{background:#12161f;}
  }
  :root[data-theme="dark"] body.signin-page{background:#12161f;}
  @media (prefers-color-scheme: dark){
    :root[data-theme="dark"] .signin-card{background:#1b1f2e; border-color:#2f3650;}
    :root[data-theme="dark"] .signin-brand,:root[data-theme="dark"] .signin-title{color:#e7ebf3;}
    :root[data-theme="dark"] .signin-card .field{background:#141a2b; border-color:#2f3650; color:#e7ebf3;}
  }
  :root[data-theme="dark"] .signin-card{background:#1b1f2e; border-color:#2f3650;}
  :root[data-theme="dark"] .signin-brand,:root[data-theme="dark"] .signin-title{color:#e7ebf3;}
  :root[data-theme="dark"] .signin-card .field{background:#141a2b; border-color:#2f3650; color:#e7ebf3;}

  /* ---------------- STATE ---------------- */

  var state = { nav:[] };

  function getUser(){ try{ return localStorage.getItem("clc_sat_user"); }catch(e){ return null; } }
  function setUser(n){ try{ localStorage.setItem("clc_sat_user", n); }catch(e){} }

  /* Browser history: every screen is a real history entry, so the browser's back / forward
     arrows move between screens, and coming back from a test page returns to the same screen. */
  function navSnap(){ try{ return JSON.parse(JSON.stringify(state.nav)); }catch(e){ return null; } }
  function histIdx(){ var h = history.state; return (h && h.clc && typeof h.idx==="number") ? h.idx : 0; }
  function histSave(push){
    var snap = navSnap(); if(!snap) return;
    try{
      if(push) history.pushState({clc:1, nav:snap, idx:histIdx()+1}, "");
      else history.replaceState({clc:1, nav:snap, idx:histIdx()}, "");
    }catch(e){}
  }
  function safeRender(){
    try{ render(); }
    catch(e){ state.nav = [{screen: getUser() ? "home" : "signin"}]; render(); histSave(false); }
  }
  function go(screen, params){ state.nav.push({screen:screen, params:params||{}}); safeRender(); histSave(true); window.scrollTo(0,0); }
  function replace(screen, params){ state.nav[state.nav.length-1] = {screen:screen, params:params||{}}; safeRender(); histSave(false); window.scrollTo(0,0); }
  function back(){
    if(histIdx() > 0){ history.back(); return; }
    if(state.nav.length > 1) state.nav.pop();
    safeRender(); histSave(false); window.scrollTo(0,0);
  }
  window.addEventListener("popstate", function(e){
    var h = e.state;
    if(h && h.clc && h.nav && h.nav.length){ state.nav = h.nav; safeRender(); window.scrollTo(0,0); }
  });
  function top(){ return state.nav[state.nav.length-1]; }

  window.go = go; window.back = back; window.replace = replace;

  /* ---------------- RENDER ---------------- */

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

  function render(){
    var t = top();

    } else {

    if(t.screen==="signin" || t.screen==="admincodes"){

      document.getElementById("screenContent").innerHTML = renderScreen(t);

  function screenTitle(t){
    switch(t.screen){
      case "signin": return "CLC SAT FOUNDATION";
      case "admincodes": return "Κωδικοί Πρόσβασης";
      case "welcome": return "Welcome";
      case "home": return "CLC SAT FOUNDATION";
      case "section": return SECTIONS[t.params.key].title;
      case "englishsub": return ENGLISH_SUBCATS.filter(function(x){return x.key===t.params.key;})[0].label;
      case "englishPractice": return ENGLISH_PRACTICE_DOMAINS.filter(function(x){return x.key===t.params.key;})[0].label;
      case "mathsub": return MATH_SUBCATS.filter(function(x){return x.key===t.params.key;})[0].label;
      case "mathPractice": return MATH_PRACTICE_DOMAINS.filter(function(x){return x.key===t.params.key;})[0].label;
      case "mathTheoryTopic": return t.params.topic.label;
      case "mathExtraTopic": return t.params.topic.label;
      case "workedBrowser": return t.params.domain;
      case "geoDomain": return t.params.d.domain;
      case "geoQuiz": return t.params.d.domain;
      case "geoQuizResult": return t.params.d.domain + " — Results";
      case "topic": return t.params.topic.label;
      case "quiz": return t.params.topic.label;
      case "quizresult": return t.params.topic.label + " — Results";
      default: return "CLC SAT FOUNDATION";
    }
  }

  function renderScreen(t){
    switch(t.screen){
      case "signin": return screenSignin();
      case "admincodes": return screenAdminCodes();
      case "welcome": return screenWelcome();
      case "home": return screenHome();
      case "section": return screenSection(t.params.key);
      case "englishsub": return screenEnglishSub(t.params.key);
      case "englishPractice": return screenEnglishPractice(t.params.key);
      case "mathsub": return screenMathSub(t.params.key);
      case "mathPractice": return screenMathPractice(t.params.key);
      case "mathTheoryTopic": return screenMathTheoryTopic(t.params.topic);
      case "mathExtraTopic": return screenMathExtraTopic(t.params.topic);
      case "workedBrowser": return screenWorkedBrowser(t.params);
      case "geoDomain": return screenGeoDomain(t.params.d);
      case "geoQuiz": return screenGeoQuiz(t.params);
      case "geoQuizResult": return screenGeoQuizResult(t.params);
      case "topic": return screenTopic(t.params.topic);
      case "quiz": return screenQuiz(t.params);
      case "quizresult": return screenQuizResult(t.params);
      default: return "<p>Not found.</p>";
    }
  }

  /* ---------------- WEEKLY ROTATING ACCESS CODE ----------------
     The code changes automatically every week (Mon–Sun, Athens time) with
     no manual updates needed. CODE_SECRET is the only "master key" — change

     at once. ADMIN_KEY is a separate secret used only to view the code

  var CODE_SECRET = "CLC-Prep-Rotate-2026-v1";

  function athensYMD(d){
    var fmt = new Intl.DateTimeFormat('en-CA', {timeZone:'Europe/Athens', year:'numeric', month:'2-digit', day:'2-digit'});
    var o = {};
    fmt.formatToParts(d).forEach(function(p){ o[p.type] = p.value; });
    return {y:parseInt(o.year,10), m:parseInt(o.month,10), d:parseInt(o.day,10)};
  }
  function isoWeekInfo(y,m,d){
    var date = new Date(Date.UTC(y, m-1, d));
    var dayNum = (date.getUTCDay()+6)%7;
    date.setUTCDate(date.getUTCDate() - dayNum + 3);
    var firstThu = new Date(Date.UTC(date.getUTCFullYear(),0,4));
    var fDayNum = (firstThu.getUTCDay()+6)%7;
    firstThu.setUTCDate(firstThu.getUTCDate() - fDayNum + 3);
    var week = 1 + Math.round((date - firstThu)/(7*24*3600*1000));
    var monday = new Date(Date.UTC(y,m-1,d));
    monday.setUTCDate(monday.getUTCDate() - dayNum);
    var sunday = new Date(monday); sunday.setUTCDate(monday.getUTCDate()+6);
    return {key: date.getUTCFullYear()+"-W"+(week<10?"0":"")+week, monday:monday, sunday:sunday};
  }
  function fnv1a(str){
    var h = 0x811c9dc5;
    for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return h >>> 0;
  }
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var CODE_ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no O/0/I/1 confusion
  function weeklyCodeForKey(weekKey){
    var rnd = mulberry32(fnv1a(CODE_SECRET+"::"+weekKey));
    var raw = "";
    for(var i=0;i<6;i++){ raw += CODE_ALPHABET[Math.floor(rnd()*CODE_ALPHABET.length)]; }
    return "CLC-"+raw.slice(0,3)+"-"+raw.slice(3);
  }
  function currentWeekInfo(){
    var ymd = athensYMD(new Date());
    return isoWeekInfo(ymd.y, ymd.m, ymd.d);
  }
  function currentWeeklyCode(){
    return weeklyCodeForKey(currentWeekInfo().key);
  }
  function normCode(s){ return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
  function fmtDate(d){
    return d.toLocaleDateString('el-GR', {timeZone:'UTC', day:'2-digit', month:'2-digit', year:'numeric'});
  }

  /* ---------------- NAME VALIDATION ----------------
     A real full name: first name + surname (2–4 words), letters only
     (Greek or Latin, accents allowed), each word 2–20 letters with a vowel,
     optional hyphen/apostrophe inside a word (e.g. Παπαδοπούλου-Νίκου, O'Neil).
     Rejects digits, symbols, one-word names and junk like "aaaa" or "xxx yyy". */
  function validateFullName(raw){
    var msg = "\u0393\u03c1\u03ac\u03c8\u03b5 \u03c4\u03bf \u03c0\u03c1\u03b1\u03b3\u03bc\u03b1\u03c4\u03b9\u03ba\u03cc \u03c3\u03bf\u03c5 \u03cc\u03bd\u03bf\u03bc\u03b1 \u03ba\u03b1\u03b9 \u03b5\u03c0\u03ce\u03bd\u03c5\u03bc\u03bf (\u03c0.\u03c7. \u039c\u03b1\u03c1\u03af\u03b1 \u03a0\u03b1\u03c0\u03b1\u03b4\u03bf\u03c0\u03bf\u03cd\u03bb\u03bf\u03c5).";
    var s = String(raw||"").normalize("NFC").replace(/\s+/g," ").trim();
    if(!s) return {ok:false, msg:msg};
    var parts = s.split(" ");
    if(parts.length < 2 || parts.length > 4) return {ok:false, msg:msg};
    var word = /^[A-Za-z\u00C0-\u024F\u0370-\u03FF\u1F00-\u1FFF]+(?:['\u2019-][A-Za-z\u00C0-\u024F\u0370-\u03FF\u1F00-\u1FFF]+)*$/;
    var vowel = /[aeiouyAEIOUY\u00C0-\u00C6\u00C8-\u00CF\u00D2-\u00D6\u00D9-\u00DD\u00E0-\u00E6\u00E8-\u00EF\u00F2-\u00F6\u00F9-\u00FD\u00FF\u0391\u0395\u0397\u0399\u039F\u03A5\u03A9\u03B1\u03B5\u03B7\u03B9\u03BF\u03C5\u03C9\u0386\u0388-\u038A\u038C\u038E\u038F\u03AC-\u03AF\u03CA-\u03CE\u0390\u03B0\u03AA\u03AB\u1F00-\u1FFF]/;
    var out = [];
    for(var i=0;i<parts.length;i++){
      var w = parts[i], letters = w.replace(/['\u2019-]/g,"");
      if(!word.test(w)) return {ok:false, msg:msg};
      if(letters.length < 2 || letters.length > 20) return {ok:false, msg:msg};
      if(!vowel.test(letters)) return {ok:false, msg:msg};
      if(/(.)\1\1/i.test(letters)) return {ok:false, msg:msg};
      if(new Set(letters.toLowerCase().split("")).size < 2) return {ok:false, msg:msg};
      out.push(w.split(/(['\u2019-])/).map(function(seg){
        if(/^['\u2019-]$/.test(seg) || !seg) return seg;
        var low = seg.toLocaleLowerCase("el").replace(/\u03c3$/,"\u03c2");
        return low.charAt(0).toLocaleUpperCase("el") + low.slice(1);
      }).join(""));
    }
    return {ok:true, name:out.join(" ")};
  }
  window.validateFullName = validateFullName;

    }

        "<div class=\"row2\"><span class=\"verdict "+(isCorrect?"ok":"no")+"\">"+(isCorrect?"✓ Correct":"✗ Not quite — correct answer: "+escapeHtml(item.correct))+"</span><span class=\"badge "+diffClass+"\">"+item.diff+"</span></div>"+
        "<div class=\"explain-block\"><b>The Rule</b>"+escapeHtml(item.rule)+"</div>"+
        "<div class=\"explain-block\"><b>The Tip</b>"+escapeHtml(item.tip)+"</div>"+
        "<div class=\"explain-block\"><b>Why "+escapeHtml(item.correct)+" is right</b>"+escapeHtml(item.why)+"</div>"+
        "<div class=\"explain-block\"><b>Step-by-Step Solution</b>"+stepsHtml+"</div>"+
        "<div class=\"explain-block\"><b>The Trap</b>"+escapeHtml(item.trap)+"</div>"+
        (poeHtml ? "<div class=\"explain-block\"><b>POE — the other choices</b>"+poeHtml+"</div>" : "")+
        "<div class=\"explain-block\"><b>Solving with Desmos</b>"+desmosHtml+"</div>"+
        "</div>";
    }
    return "<p class=\"eyebrow\" style=\"color:var(--practice);\">"+escapeHtml(p.d.domain)+" · Question "+(p.i+1)+" of "+p.qs.length+" <span class=\"badge "+diffClass+"\" style=\"margin-left:6px;\">"+item.diff+"</span></p>"+
      "<div class=\"progress-dots\">"+dots+"</div>"+
      "<div class=\"slideshow\"><img src=\""+geoImgPath(item.gi)+"\" alt=\"Question figure\"></div>"+
      answerHtml + explainHtml +
      (answered ? "<button class=\"btn primary\" onclick=\"geoNext()\">"+(p.i===p.qs.length-1?"See Results":"Next →")+"</button>" : "");
  }

  function geoImgPath(gi){ return "media/geo-trig-figs/q"+gi+".jpg"; }

  function gridClean(s){return String(s==null?'':s).replace(/[\u2212\u2013]/g,'-').replace(/[()]/g,' ').trim().toLowerCase();}
  function gridNum(s){s=s.replace(/\s+/g,'');var m=s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);if(m){return +m[2]===0?null:(+m[1])/(+m[2]);}return /^-?\d*\.?\d+$/.test(s)?Number(s):null;}
  function clcSf2v(a,t){var s=String(a==null?'':a).replace(/&minus;/g,'-').replace(/[−–—]/g,'-').replace(/,/g,'.').replace(/\s+/g,'');if(!/^-?(\d+\.\d+|\.\d+)$/.test(s)||t===null||isNaN(t))return false;var v=Number(s);if(isNaN(v))return false;if(v!==0&&t!==0&&((v<0)!==(t<0)))return false;var b=s.replace(/^-/,''),d=b.length-b.indexOf('.')-1,sig=b.replace('.','').replace(/^0+/,'').length;if(sig<2)return false;var p=Math.pow(10,d),r=Math.round(Math.abs(t)*p+1e-7)/p;return Math.abs(Math.abs(v)-r)<1e-9;}function clcSf2(a,k){var kk=String(k==null?'':k).replace(/&minus;/g,'-').replace(/[−–—]/g,'-').replace(/\s+/g,'');var m=kk.match(/^(-?\d+)\/(-?\d+)$/);if(!m||+m[2]===0)return false;return clcSf2v(a,(+m[1])/(+m[2]));}
function gridOne(a,k){if(clcSf2(a,k))return true;var s=a.replace(/\s+/g,''),t=gridNum(k),v=gridNum(s);if(s===k.replace(/\s+/g,''))return true;if(v===null||t===null)return false;if(Math.abs(v-t)<1e-9)return true;if(s.indexOf('/')>=0)return false;
    var neg=s.charAt(0)==='-',p=(neg?s.slice(1):s).split('.');if(p.length<2)return false;var ip=p[0].replace(/^0+/,'');if(p[1].length<Math.max(0,5-ip.length-1))return false;var f=Math.pow(10,p[1].length);return Math.abs(v-Math.trunc(t*f)/f)<1e-9||Math.abs(v-Math.round(t*f)/f)<1e-9;}
  function ansMatch(a,key){a=gridClean(a);var ks=gridClean(key).split(/\s+or\s+/);for(var i=0;i<ks.length;i++){if(gridOne(a,ks[i].trim()))return true;}return false;}
  function normalizeAns(s){ return String(s).trim().toLowerCase().replace(/\s+/g,''); }

  window.geoPick = function(letter){
    var p = top().params;
    if(p.picked!==null) return;
    p.picked = letter;
    if(normalizeAns(letter)===normalizeAns(p.qs[p.i].correct)) p.correct++;
    render(); histSave(false);
  };
  window.geoSubmitGridin = function(){
    var p = top().params;
    if(p.picked!==null) return;
    var val = document.getElementById("gridinInput").value.trim();
    if(!val) return;
    p.gridval = val;
    p.picked = val;
    if(ansMatch(val,p.qs[p.i].correct)) p.correct++;
    render(); histSave(false);
  };
  window.geoNext = function(){
    var p = top().params;
    if(p.i+1 >= p.qs.length){
      go("geoQuizResult", {d:p.d, correct:p.correct, total:p.qs.length});
      return;
    }
    p.i++; p.picked=null; p.gridval="";
    render(); histSave(false);
  };

  function screenGeoQuizResult(p){
    var pct = Math.round(100*p.correct/p.total);
    return "<div class=\"score-hero\"><div class=\"num mono\">"+p.correct+"/"+p.total+"</div><div class=\"lbl\">"+escapeHtml(p.d.domain)+" — "+pct+"% correct</div></div>"+
      "<button class=\"btn primary\" onclick=\"startGeoQuiz('"+p.d.key+"')\">Try Again</button>"+
      "<div style=\"height:10px;\"></div>"+
      "<button class=\"btn ghost\" onclick=\"openMathTheoryTopic('geometry-trigonometry')\">Back to Geometry & Trigonometry</button>";
  }
  window.openTopic = function(key){
    var topic = ENGLISH_TOPICS.filter(function(x){return x.key===key;})[0];
    go("topic", {topic:topic});
  };

  function diffCounts(qs){
    var c = {Easy:0, Medium:0, Hard:0};
    qs.forEach(function(q){ c[q.diff] = (c[q.diff]||0)+1; });
    return c;
  }

  function screenTopic(topic){
    var qs = topicQuestions(topic.domain);
    var c = diffCounts(qs);
    return "<div class=\"card\" style=\"position:relative;\">"+
      "<div class=\"subject-strip\" style=\"background:var(--english);\"></div>"+
      "<p class=\"eyebrow\" style=\"color:var(--english);\">"+topic.icon+" "+escapeHtml(topic.label)+"</p>"+
      "<p style=\"font-size:14px; color:var(--muted); margin:0 0 14px;\">"+escapeHtml(topic.desc)+"</p>"+
      "<div style=\"display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px;\">"+
        "<span class=\"badge easy\">"+c.Easy+" Easy</span>"+
        "<span class=\"badge medium\">"+c.Medium+" Medium</span>"+
        "<span class=\"badge hard\">"+c.Hard+" Hard</span>"+
      "</div>"+
      "</div>"+
      "<button class=\"btn primary\" onclick=\"startQuiz('"+topic.key+"')\">Start — "+qs.length+" Questions →</button>";
  }

  window.startQuiz = function(topicKey){
    var topic = ENGLISH_TOPICS.filter(function(x){return x.key===topicKey;})[0];
    var qs = topicQuestions(topic.domain);
    go("quiz", {topic:topic, qs:qs, i:0, correct:0, picked:null});
  };

  function screenQuiz(p){
    var item = p.qs[p.i];
    var letters = ["A","B","C","D"];
    var dots = p.qs.map(function(_,idx){ return "<span class=\""+(idx<p.i?"done":idx===p.i?"current":"")+"\"></span>"; }).join("");
    var diffClass = item.diff.toLowerCase();
    var choicesHtml = item.choices.map(function(c,idx){
      var cls = "choice";
      if(p.picked!==null){
        if(idx===item.correct) cls+=" correct"; else if(idx===p.picked) cls+=" incorrect";
      }
      return "<button class=\""+cls+"\" "+(p.picked!==null?"disabled":"")+" onclick=\"quizPick("+idx+")\"><span class=\"letter\">"+letters[idx]+"</span><span>"+escapeHtml(c)+"</span></button>";
    }).join("");
    var explainHtml = "";
    if(p.picked!==null){
      var ok = p.picked===item.correct;
      var poeHtml = item.poe.map(function(poe){
        return "<div class=\"poe-item\">✗ <b class=\"mono\">"+letters[poe.idx]+"</b> — "+escapeHtml(poe.text)+"</div>";
      }).join("");
      explainHtml = "<div class=\"explain-panel\">"+
        "<div class=\"row2\"><span class=\"verdict "+(ok?"ok":"no")+"\">"+(ok?"✓ Correct":"✗ Not quite — correct answer: "+letters[item.correct])+"</span><span class=\"badge "+diffClass+"\">"+item.diff+"</span></div>"+
        "<div class=\"explain-block\"><b>The Rule</b>"+escapeHtml(item.rule)+"</div>"+
        "<div class=\"explain-block\"><b>The Tip</b>"+escapeHtml(item.tip)+"</div>"+
        "<div class=\"explain-block\"><b>Why "+letters[item.correct]+" is right</b>"+escapeHtml(item.why)+"</div>"+
        "<div class=\"explain-block\"><b>The Trap</b>"+escapeHtml(item.trap)+"</div>"+
        "<div class=\"explain-block\"><b>POE — the other three</b>"+poeHtml+"</div>"+
        "</div>";
    }
    return "<p class=\"eyebrow\" style=\"color:var(--english);\">"+escapeHtml(p.topic.label)+" · Question "+(p.i+1)+" of "+p.qs.length+" <span class=\"badge "+diffClass+"\" style=\"margin-left:6px;\">"+item.diff+"</span></p>"+
      "<div class=\"progress-dots\">"+dots+"</div>"+
      "<p class=\"qstem\">"+escapeHtml(item.stem)+"</p>"+
      choicesHtml + explainHtml +
      (p.picked!==null ? "<button class=\"btn primary\" onclick=\"quizNext()\">"+(p.i===p.qs.length-1?"See Results":"Next →")+"</button>" : "");
  }

  window.quizPick = function(idx){
    var p = top().params;
    if(p.picked!==null) return;
    p.picked = idx;
    if(idx===p.qs[p.i].correct) p.correct++;
    render(); histSave(false);
  };
  window.quizNext = function(){
    var p = top().params;
    if(p.i+1 >= p.qs.length){
      go("quizresult", {topic:p.topic, correct:p.correct, total:p.qs.length});
      return;
    }
    p.i++; p.picked = null;
    render(); histSave(false);
  };

  function screenQuizResult(p){
    var pct = Math.round(100*p.correct/p.total);
    return "<div class=\"score-hero\"><div class=\"num mono\">"+p.correct+"/"+p.total+"</div><div class=\"lbl\">"+escapeHtml(p.topic.label)+" — "+pct+"% correct</div></div>"+
      "<button class=\"btn primary\" onclick=\"startQuiz('"+p.topic.key+"')\">Try Again</button>"+
      "<div style=\"height:10px;\"></div>"+
      "<button class=\"btn ghost\" onclick=\"go('englishsub',{key:'practice'})\">Back to Practice</button>";
  }

  /* ---------------- BOOT ---------------- */

  function boot(){
    var qs;
    try{ qs = new URLSearchParams(location.search); }catch(e){ qs = null; }
    if(qs && qs.get("codes") === ADMIN_KEY){
      state.nav = [{screen:"admincodes"}];
    } else {
      state.nav = [{screen:"signin"}];
      var signed = null; try{ signed = sessionStorage.getItem("clc_signed"); }catch(e){}
      var h = history.state;
      if(signed && getUser() && normCode(signed) === normCode(currentWeeklyCode()) && h && h.clc && h.nav && h.nav.length){
        state.nav = h.nav;
      }
    }
    safeRender();
    histSave(false);
  }

  if(window.claude && window.claude.hot){
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot();
  } else {
    boot();
  }
})();
</script>
