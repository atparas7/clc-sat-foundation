<script>/* ===== CLC SAT Foundation — dark mode =====
   Added to the <head> of every page by tools/build-encrypted.mjs (lock page included), so the chosen theme is
   applied before the page is drawn. The choice is kept on the device (localStorage "clc_theme": "dark" / "light");
   with no choice yet it follows the device setting. The home page has a 🌙 / ☀️ button in its top bar; test pages
   get a small round button at the bottom left. window.CLCTheme = {get, set, toggle}. */
(function(){
  "use strict";
  var KEY = "clc_theme", root = document.documentElement;
  /* Module tests are a copy of the paper test book (white pages, white question images), and the PSAT Vocabulary Lab has its own colours: they always stay light. */
  var PAPER = /^(module[12]-practice-\d+|math-module[12]-set\d+|psat-vocabulary-lab)$/.test((location.pathname.split("/").pop() || "").replace(/\.html?$/i, ""));
  function stored(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }
  function system(){ try{ return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }catch(e){ return "light"; } }
  function get(){ var s = stored(); return s === "dark" || s === "light" ? s : system(); }
  function apply(t){ if (PAPER) t = "light"; root.setAttribute("data-theme", t); root.style.colorScheme = t; }
  function set(t){ try{ localStorage.setItem(KEY, t); }catch(e){} apply(t); paintButton(); }
  function toggle(){ set(get() === "dark" ? "light" : "dark"); }
  apply(get());

  var D = 'html[data-theme="dark"]';
  var css =
    /* test pages (practice tests): colours */
    D + "{--ink:#e7ebf3;--mut:#9aa5b8;--line:#2f3650;--bg:#0d121e;--gold:#e4bb6c;--goldl:#2c2413;--ok:#69cd9c;--okl:#102a1f;--bad:#e88478;--badl:#2c1714;--cr:#c8314d;--crd:#9e1f37;" +
      "--crimson:#d0405c;--crimson-dark:#f0a3b2;--panel:#161e30;--muted:#9aa5b8;}" +
    D + " body{background:var(--bg)!important;color:var(--ink);}" +
    D + " .card," + D + " .ch," + D + " .qg," + D + " .flag," + D + " .btn.ghost," + D + " .filters button," + D + " .rv," + D + " .tm label," +
      D + " .xo-btn," + D + " .flagbtn," + D + " .badge," + D + " .pill," + D + " .zhint," + D + " .navbtn:not(.primary)," + D + " .choice," + D + " .pdot," + D + " .qcard," + D + " .navbar" +
      "{background:#161e30!important;color:var(--ink)!important;border-color:var(--line)!important;}" +
    D + " .ch.sel," + D + " .tm label:has(input:checked)," + D + " .choice.selected," + D + " .pdot.current{background:#3a1621!important;border-color:var(--cr)!important;}" +
    D + " .qg.ans," + D + " .pdot.answered{background:#e7ebf3!important;color:#0d121e!important;}" +
    D + " .bx," + D + " .expl{background:#1b2236!important;color:var(--ink);}" +
    D + " .bx.T b{color:#8fc3ec;}" +
    D + " input," + D + " textarea," + D + " select{background:#0f1626;color:var(--ink);border-color:var(--line);}" +
    D + " .hbtn," + D + " #timer.low," + D + " #calc-panel .bar button," + D + " #zoom button{background:#161e30!important;color:#f0a3b2!important;}" +
    D + " .passage," + D + " .qprompt{color:var(--ink);}" +
    D + " .qnum{background:#e7ebf3!important;color:#0d121e!important;}" +
    D + " .lock h1{color:#f0a3b2!important;}" +
    /* tables inside questions (also the ones with inline colours) */
    D + " table th{background:#232c45!important;color:var(--ink)!important;border-color:#56607a!important;}" +
    D + " table td{color:var(--ink)!important;border-color:#56607a!important;}" +
    D + " .clc-tabnote{color:#9aa5b8!important;}" +
    /* pictures of questions and graphs stay on white so they can be read */
    D + " .passage img," + D + " .qimg," + D + " .qprompt img," + D + " #zoom img," + D + " .figimg{background:#fff;border-radius:6px;padding:4px;}" +
    /* CLC tools and results bar */
    D + " .clc-dock{background:rgba(13,18,30,.97)!important;border-color:#2f3650!important;}" +
    D + " .clc-hl-btn{background:#161e30!important;color:#e4bb6c!important;border-color:#e4bb6c!important;}" +
    D + " .clc-hl-btn.on{background:#e4bb6c!important;color:#0d121e!important;}" +
    D + " mark.clc-hl{color:#141a2b!important;}" +
    D + " .clcx-bar{background:#1b2236!important;border-color:#2f3650!important;color:var(--ink)!important;}" +
    D + " .clcx-bar h4{color:var(--ink)!important;} " + D + " .clcx-bar p{color:#9aa5b8!important;}" +
    D + " .clcx-btn:not(.main){background:#161e30!important;color:var(--ink)!important;border-color:#2f3650!important;}" +
    /* lock page */
    D + " .lock{background:#161e30!important;border-color:#2f3650!important;color:#e7ebf3;} " + D + " .lock p{color:#9aa5b8!important;}" +
    D + " .lock input{background:#0f1626!important;color:#e7ebf3!important;border-color:#2f3650!important;}" +
    /* the round button on test pages */
    ".clc-theme-btn{position:fixed;left:16px;bottom:calc(var(--clc-dock-h,0px) + 16px);z-index:8999;width:42px;height:42px;border-radius:50%;" +
      "border:1.5px solid #d9d2bd;background:#fff;font-size:19px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;padding:0;}" +
    D + " .clc-theme-btn{background:#161e30;border-color:#2f3650;}" +
    "@media print{.clc-theme-btn{display:none!important;}}";
  var st = document.createElement("style"); st.id = "clc-theme-css"; st.textContent = css;
  (document.head || root).appendChild(st);

  var btn = null;
  function paintButton(){ if (btn){ var d = get() === "dark"; btn.textContent = d ? "☀️" : "🌙"; btn.title = d ? "Light mode" : "Dark mode"; btn.setAttribute("aria-label", btn.title); } }
  function addButton(){
    var file = (location.pathname.split("/").pop() || "index").replace(/\.html?$/i, "");
    if (file === "index" || file === "" || PAPER || document.getElementById("clc-lock") || !document.body) return;   // the home page has its own button
    btn = document.createElement("button"); btn.type = "button"; btn.className = "clc-theme-btn";
    btn.onclick = toggle; paintButton(); document.body.appendChild(btn);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", addButton); else addButton();
  window.CLCTheme = {get: get, set: set, toggle: toggle};
})();
</script>

<script>
(function(){
  var WEEK = 7, ITER = 600000, SITE = "clc-sat-foundation", STORE = "clc_site_key";
  var te = new TextEncoder();
  function el(id){ return document.getElementById(id); }
  function bytes(b64){ return Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); }); }
  function b64(buf){ var s = "", a = new Uint8Array(buf); for (var i = 0; i < a.length; i += 32768) s += String.fromCharCode.apply(null, a.subarray(i, i + 32768)); return btoa(s); }
  function norm(s){ return String(s || "").trim(); }   // exactly as it is: capitals and hyphens count
  var data = bytes(el("clc-payload").textContent.trim());
  function open(key){
    return crypto.subtle.decrypt({name: "AES-GCM", iv: data.slice(0, 12)}, key, data.slice(12)).then(function(plain){
      var html = new TextDecoder().decode(plain);
      return new Promise(function(done){
        function show(){                                       // replace this lock page by the real page
          document.open(); document.write(html); document.close(); done();
        }
        if (document.readyState === "complete") setTimeout(show, 0);   // document.open() is ignored while this page is still loading
        else window.addEventListener("load", function(){ setTimeout(show, 0); });
      });
    });
  }
  function fromPassword(pw){
    return crypto.subtle.importKey("raw", te.encode(norm(pw)), "PBKDF2", false, ["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey({name: "PBKDF2", hash: "SHA-256", salt: te.encode(SITE + ":week:" + WEEK), iterations: ITER},
        base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
    });
  }
  function ask(msg){
    el("clc-wait").style.display = "none"; el("clc-form").classList.remove("hide");
    el("clc-err").textContent = msg || ""; el("clc-pw").value = ""; el("clc-pw").focus();
  }
  function submit(){
    var pw = el("clc-pw").value; if (!norm(pw)){ ask("Please type the password."); return; }
    el("clc-go").disabled = true; el("clc-err").textContent = "Checking…";
    fromPassword(pw).then(function(key){
      return crypto.subtle.decrypt({name: "AES-GCM", iv: data.slice(0, 12)}, key, data.slice(12)).then(function(){ return key; });
    }).then(function(key){
      return crypto.subtle.exportKey("raw", key).then(function(raw){
        try{ sessionStorage.setItem(STORE, JSON.stringify({w: WEEK, k: b64(raw)})); }catch(e){}
        return open(key);
      });
    }).catch(function(){
      el("clc-go").disabled = false;
      ask("Wrong password. Type it exactly as you received it (CAPITAL letters, with the hyphens). The password changes every Monday — ask your teacher for this week's password.");
    });
  }
  if (!window.crypto || !crypto.subtle){ ask("Please open this page in an up-to-date browser (Chrome, Safari, Edge or Firefox)."); return; }
  // Browsers may keep an old copy of this page. Ask the server for the current one (this also refreshes the
  // browser's copy); if it is from a newer build, reload once. Never blocks for more than 2.5 s.
  function fresh(){
    var BUILD = (document.querySelector('meta[name="clc-build"]') || {}).content || "";
    return new Promise(function(done){
      var over = false, t = setTimeout(function(){ over = true; done(); }, 2500);
      if (!window.fetch){ clearTimeout(t); done(); return; }
      fetch(location.href.split("#")[0], {cache: "reload"}).then(function(r){ return r.ok ? r.text() : ""; }).then(function(txt){
        if (over) return; clearTimeout(t);
        var m = /<meta name="clc-build" content="([^"]+)">/.exec(txt), flag = "clc_reload_" + (m ? m[1] : "");
        var tried = false; try{ tried = !!sessionStorage.getItem(flag); }catch(e){}
        if (m && m[1] !== BUILD && !tried){ try{ sessionStorage.setItem(flag, "1"); }catch(e){} location.reload(); return; }
        done();
      }).catch(function(){ if (!over){ clearTimeout(t); done(); } });
    });
  }
  fresh().then(start);
  function start(){
  el("clc-go").addEventListener("click", submit);
  el("clc-pw").addEventListener("keydown", function(e){ if (e.key === "Enter") submit(); });
  var saved = null; try{ saved = JSON.parse(sessionStorage.getItem(STORE) || "null"); }catch(e){}
  if (saved && saved.w === WEEK && saved.k){                 // signed in earlier in this tab, same week: open straight away
    el("clc-wait").style.display = "block";
    crypto.subtle.importKey("raw", bytes(saved.k), "AES-GCM", true, ["decrypt"]).then(open).catch(function(){
      try{ sessionStorage.removeItem(STORE); }catch(e){}
      ask("");
    });
  } else ask("");
  }
})();
</script>
